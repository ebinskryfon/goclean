name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-website:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Tell goclean-desktop about the release
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          RELEASE_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          GH_TOKEN="$RELEASE_TOKEN" gh release view "$TAG" -R "${{ github.repository }}" \
            --json tagName,publishedAt,body > release.json
          jq '{event_type:"goclean-release", client_payload:{tag:.tagName, date:.publishedAt[:10], body:.body}}' release.json \
          | gh api repos/ebinskryfon/goclean-desktop/dispatches --input -
